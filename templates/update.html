<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Todo · Earthy Theme</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ----- EARTHY THEME (exactly from your variables) ----- */
        :root {
            --cream:    #F5F0E8;
            --parchment:#EDE5D8;
            --linen:    #E0D5C5;
            --warm-mid: #C4B49A;
            --taupe:    #9E8E78;
            --umber:    #6B5B45;
            --espresso: #3D2E1E;
            --ink:      #1E1510;
            --gold:     #B89A6A;
            --gold-lt:  #D4B896;
            --sand:     #D6C9B5;
            --white:    #FAF7F2;
            --done-bg:  rgba(95,110,85,0.12);
            --done-txt: #4A5C3A;
            --pend-bg:  rgba(160,120,60,0.12);
            --pend-txt: #7A5A20;
            --radius:   14px;
            --radius-sm:8px;
            --shadow-sm: 0 6px 12px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 28px rgba(0,0,0,0.08);
            --transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        }

        body {
            background: linear-gradient(145deg, var(--cream) 0%, var(--parchment) 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            padding: 2rem 1.8rem 2.2rem;
            transition: var(--transition);
            border: 1px solid rgba(180, 150, 110, 0.2);
            animation: fadeSlideUp 0.4s ease-out;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 1.8rem;
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--espresso) 0%, var(--umber) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        h2::before {
            content: "🌿";
            font-size: 1.8rem;
            background: none;
            -webkit-background-clip: unset;
            color: var(--gold);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            color: var(--umber);
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--sand);
            border-radius: var(--radius-sm);
            background: var(--cream);
            font-family: inherit;
            font-size: 0.95rem;
            transition: var(--transition);
            outline: none;
            color: var(--ink);
        }

        input:focus,
        textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184, 154, 106, 0.2);
            background: var(--white);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
            background: var(--parchment);
            padding: 0.6rem 1rem;
            border-radius: 60px;
            transition: var(--transition);
        }
        .checkbox:hover {
            background: var(--linen);
        }
        .checkbox input {
            width: 18px;
            height: 18px;
            accent-color: var(--gold);
            margin: 0;
            cursor: pointer;
        }
        .checkbox label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: normal;
            color: var(--espresso);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            background: var(--espresso);
            color: #FEF6E8;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background: var(--umber);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn::before {
            content: "✨";
            font-size: 1.1rem;
        }

        /* subtle back link (optional, improves UX) */
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: var(--taupe);
            text-decoration: none;
            font-size: 0.8rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .back-link a:hover {
            color: var(--espresso);
            text-decoration: underline;
        }

        /* responsive */
        @media (max-width: 500px) {
            .container {
                padding: 1.5rem;
            }
            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Edit Todo</h2>

    <form id="createForm" method="post" action="/todo/update/{{todo.id}}">
        <div class="form-group">
            <label>📌 Title</label>
            <input type="text" name="title" id="todoTitle" value="{{todo.title}}" placeholder="Write a clear title..." required>
        </div>

        <div class="form-group">
            <label>📝 Description</label>       
            <textarea name="description" id="todoDesc" placeholder="Add details (optional)">{{todo.description}}</textarea>
        </div>

        <div class="checkbox">
            {% if todo.done %}
            <input type="checkbox" name="done" id="doneCheck" checked>
            {% else %}
            <input type="checkbox" name="done" id="doneCheck">
            {% endif %}
            <label for="doneCheck">✓ Mark as completed</label>
        </div>

        <button type="submit" class="btn">Update Todo</button>
    </form>+

    <div class="back-link">
        <a href="/todo/">← Back to Todo List</a>
    </div>
</div>

</body>
</html>
