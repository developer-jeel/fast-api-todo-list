<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Todo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:450px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

.input-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#555;
}

input[type="text"],
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

textarea{
    height:120px;
    resize:none;
}

.checkbox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.btn{
    width:100%;
    padding:12px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#4338ca;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:15px;
    text-decoration:none;
    color:#666;
}
</style>

</head>
<body>

<div class="container">

    <h2>✏️ Update Todo</h2>

    <form>

        <div class="input-group">
            <label>Title</label>
            <input type="text" placeholder="Enter Todo Title">
        </div>

        <div class="input-group">
            <label>Description</label>
            <textarea placeholder="Enter Todo Description"></textarea>
        </div>

        <div class="checkbox">
            <input type="checkbox" id="done">
            <label for="done">Completed</label>
        </div>

        <button class="btn">Update Todo</button>

    </form>

    <a href="#" class="back-btn">← Back to Todo List</a>

</div>

</body>
</html>
