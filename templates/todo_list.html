<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:900px;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#4f46e5;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f9ff;
}

.completed{
    color:green;
    font-weight:bold;
}

.pending{
    color:red;
    font-weight:bold;
}

.btn{
    padding:8px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    color:white;
    text-decoration:none;
    margin:2px;
}

.edit{
    background:#f59e0b;
}

.edit:hover{
    background:#d97706;
}

.delete{
    background:#ef4444;
}

.delete:hover{
    background:#dc2626;
}
</style>

</head>
<body>

<div class="container">
    <h1>📝 Todo List</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>1</td>
                <td>Learn FastAPI</td>
                <td>Complete CRUD Operations</td>
                <td class="pending">Pending</td>
                <td>
                    <button class="btn edit">Edit</button>
                    <button class="btn delete">Delete</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>Database Setup</td>
                <td>Create SQLAlchemy Models</td>
                <td class="completed">Completed</td>
                <td>
                    <button class="btn edit">Edit</button>
                    <button class="btn delete">Delete</button>
                </td>
            </tr>

            <tr>
                <td>3</td>
                <td>Frontend Design</td>
                <td>Create Todo UI</td>
                <td class="pending">Pending</td>
                <td>
                    <button class="btn edit">Edit</button>
                    <button class="btn delete">Delete</button>
                </td>
            </tr>

        </tbody>
    </table>
</div>

</body>
</html>
